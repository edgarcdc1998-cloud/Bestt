name: Android Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Print Toolchain Versions
        run: |
          flutter --version
          dart --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Verify Required Android Signing Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=()
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && MISSING_SECRETS+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && MISSING_SECRETS+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$ANDROID_KEY_ALIAS" ] && MISSING_SECRETS+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD" ] && MISSING_SECRETS+=("ANDROID_KEY_PASSWORD")

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "::error title=Missing Signing Secrets::The following required GitHub Actions Secrets are missing:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "::error::- $secret"
            done
            echo "=========================================================================="
            echo "ERROR: Release APK signing cannot proceed without all 4 secrets configured."
            echo "Please navigate to: Repository Settings -> Secrets and variables -> Actions"
            echo "and define the missing secrets listed above."
            echo "=========================================================================="
            exit 1
          fi
          echo "All 4 required Android signing secrets are present."

      - name: Configure Keystore and Properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat <<EOF > android/key.properties
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        env:
          ANDROID_STORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Clean up Keystore and Secrets
        if: always()
        run: |
          rm -f android/app/release.keystore android/key.properties

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
