name: Android Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Print Toolchain Versions
        run: |
          flutter --version
          dart --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Configure Keystore and Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Configuring official Release Keystore from repository secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            printf '%s\n' \
              "storeFile=release.keystore" \
              "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
              "keyAlias=$ANDROID_KEY_ALIAS" \
              "keyPassword=$ANDROID_KEY_PASSWORD" > android/key.properties
            echo "Official signing configured successfully."
          else
            echo "::warning title=Using CI Build Key::Repository secrets for signing are not configured yet. Generating a temporary CI keystore for Release APK..."
            keytool -genkey -v -keystore android/app/release.keystore -alias bestplayerci -keyalg RSA -keysize 2048 -validity 10000 -storepass bestplayerpass -keypass bestplayerpass -dname "CN=BestPlayerCI, OU=Mobile, O=BestPlayer, L=SaoPaulo, ST=SP, C=BR"
            printf '%s\n' \
              "storeFile=release.keystore" \
              "storePassword=bestplayerpass" \
              "keyAlias=bestplayerci" \
              "keyPassword=bestplayerpass" > android/key.properties
            echo "CI signing configured successfully."
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Clean up Keystore and Secrets
        if: always()
        run: |
          rm -f android/app/release.keystore android/key.properties

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
