plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.scovil1.bestplayer"
    compileSdkVersion 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.scovil1.bestplayer"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                keystorePropertiesFile.withReader('UTF-8') { reader ->
                    keystoreProperties.load(reader)
                }
            }

            def storePath = keystoreProperties.getProperty('storeFile')
                ?: System.getenv('ANDROID_STORE_FILE')
                ?: 'release.keystore'
            def storePwd = keystoreProperties.getProperty('storePassword')
                ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def alias = keystoreProperties.getProperty('keyAlias')
                ?: System.getenv('ANDROID_KEY_ALIAS')
            def keyPwd = keystoreProperties.getProperty('keyPassword')
                ?: System.getenv('ANDROID_KEY_PASSWORD')

            if (storePwd && alias && keyPwd) {
                def candidateFiles = [
                    file(storePath),
                    rootProject.file(storePath),
                    file("app/${storePath}"),
                    rootProject.file("app/${storePath}"),
                    file("release.keystore"),
                    rootProject.file("app/release.keystore")
                ]
                def resolvedFile = candidateFiles.find { it != null && it.exists() }
                if (resolvedFile != null) {
                    storeFile resolvedFile
                    storePassword storePwd
                    keyAlias alias
                    keyPassword keyPwd
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig = (signingConfigs.release.storeFile != null) ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}
